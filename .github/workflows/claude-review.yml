name: Claude review

# A Claude Code review of every pull request, again on every push to it.
#
# The school asked on 10 October 2026 for every change to be reviewed by
# Claude Code before it reaches `main`. This runs beside CI, not in front of
# it: CI is the gate, the review is a second reader that leaves comments.
#
# It needs one repository secret, set under Settings → Secrets and variables
# → Actions: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, billed to a
# Claude subscription) or ANTHROPIC_API_KEY (billed to the API). Without
# either the job says so and passes, so a missing secret never turns a pull
# request red.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude Code review
    # Secrets are not given to pull requests from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for a credential
        id: credential
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$API_KEY$OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret is set, so the Claude review was skipped."
          fi

      - uses: actions/checkout@v7
        if: steps.credential.outputs.present == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.credential.outputs.present == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read web/AGENTS.md and the parts of
            docs/PROJECT-CONTEXT.md the change touches first: they are the
            rules this system is held to (only the workflow engine writes
            applications.status, no parent wording in code, plain English
            for parents, parents scoped by their session, paid means
            verified, snapshots not references, applied migrations are never
            edited).

            Look for, in this order: bugs and broken rules from that file,
            data leaks across families, security problems, migrations that
            would fail or lose data on the live database, and missing tests
            for new behaviour. Skip style nits a linter would catch.

            Put each finding on the line it concerns with
            mcp__github_inline_comment__create_inline_comment. Then post one
            summary comment with `gh pr comment`: what the change does, the
            findings by severity, and "No problems found" if there are none.
            Be specific and short.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
