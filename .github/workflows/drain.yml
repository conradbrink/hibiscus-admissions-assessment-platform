# An hourly backstop for the job queue. Not the schedule.
#
# This asked GitHub for `*/5 * * * *` and did not get it: between 7 and 10
# September 2026 that schedule produced 22 runs in 74 hours — one every three
# and a half hours, 2.5% of the cadence it claimed. GitHub throttles scheduled
# workflows hard, and a workflow that says five minutes while delivering three
# hours is worse than one that admits to an hour, because the first hides the
# gap. The real five-minute schedule is Supabase `pg_cron` calling the same
# endpoint (supabase/migrations/20260911220000_drain_schedule.sql); this is
# what catches it if the database's scheduler stops, and web/vercel.json's
# nightly cron is the last resort under that.
#
# Two repository secrets are needed:
#   DRAIN_URL    https://<site>/api/jobs/drain
#   CRON_SECRET  the same value as the Vercel CRON_SECRET environment variable
# The minute is arbitrary and deliberately not :00, to sit away from whatever
# else the world runs on the hour.
name: Drain job queue
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: drain
  cancel-in-progress: false
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/jobs/drain
        env:
          # The URL is not secret, so a repository variable works for it too.
          DRAIN_URL: ${{ secrets.DRAIN_URL || vars.DRAIN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$DRAIN_URL" ] && echo "DRAIN_URL: set" || echo "DRAIN_URL: MISSING (add it under Settings > Secrets and variables > Actions, as a repository secret or variable)"
          [ -n "$CRON_SECRET" ] && echo "CRON_SECRET: set" || echo "CRON_SECRET: MISSING (add it under Settings > Secrets and variables > Actions, as a repository secret)"
          if [ -z "$DRAIN_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Nothing to do until both exist."
            exit 0
          fi
          code=$(curl -sS -o /tmp/drain.json -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$DRAIN_URL")
          echo "HTTP $code"
          cat /tmp/drain.json; echo
          [ "$code" = "200" ]
